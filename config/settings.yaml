# All tunables live here. No magic numbers in code.

dataset:
  # Selected from data/parquet/slice_report.* (TAWOS v1.1). Person identities remain
  # project-qualified; do not merge the same numeric User.ID across projects.
  projects: ["MESOS", "FAB", "TIMOB", "DM", "EVG"]
  project_domains:
    MESOS: "cluster orchestration and distributed systems"
    FAB: "distributed ledger and blockchain infrastructure"
    TIMOB: "mobile application SDK and runtime"
    DM: "scientific data management and observatory pipelines"
    EVG: "database build, test, and continuous integration"
  min_tickets_per_person: 15
  holdout_cutoff: "2019-01-01"   # graph built from data before; eval briefs from after

bucketing:
  period: quarter
  max_tickets_per_bucket: 30     # deterministically chunk larger buckets
  min_tickets_per_bucket: 3      # drop sparser buckets (too little signal)
  max_description_chars: 1200    # truncate long descriptions
  # Comments are deliberately excluded: they postdate issue creation and cannot be
  # exposed safely in creation-time benchmark queries without timestamped evidence.
  include_comments_if_empty: false

llm:
  # Verify current model strings against https://docs.claude.com before first run.
  extraction_model: "claude-haiku-4-5-20251001"
  intent_model: "claude-sonnet-5"
  rerank_model: "claude-sonnet-5"
  temperature: 0.0
  max_stage_cost_usd: 25.0

embedding:
  model: "BAAI/bge-small-en-v1.5"   # local, 384 dims; changing requires index rebuild
  dims: 384

normalization:
  skill_merge_threshold: 0.85       # cosine sim for merging skill terms
  specialization_merge_threshold: 0.80

projections:
  recency_half_life_days: 540

retrieval:
  vector_top_k: 40
  structured_top_k: 40
  rerank_top_k: 15

scoring:
  weights:
    specialization_match: 0.40
    skill_overlap: 0.25
    recency: 0.20
    evidence_strength: 0.15

eval:
  n_briefs: 150
  min_brief_chars: 300     # briefs need enough text to be meaningful
  seed: 20260713
  manifest_version: "tawos-v1.1-benchmark-v1"
  validation_fraction: 0.20
  hit_at: [1, 5, 10]
